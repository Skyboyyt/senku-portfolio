<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0e0f12">
<title>Page not found — Senku</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e0f12'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='700' font-size='34' fill='%23ff6a3d'%3ES%3C/text%3E%3C/svg%3E">
<script>try{var a=localStorage.getItem('fahad-accent');if(['tide','orchid','punch','mint'].includes(a))document.documentElement.dataset.accent=a}catch(e){}</script>
<style>
:root{--accent:#ff6a3d;--accent-hover:#ff8058}
:root[data-accent=tide]{--accent:#4f9dff;--accent-hover:#73b1ff}:root[data-accent=orchid]{--accent:#b48cff;--accent-hover:#c4a3ff}:root[data-accent=punch]{--accent:#ff5c8a;--accent-hover:#ff7ea3}:root[data-accent=mint]{--accent:#2fd18c;--accent-hover:#5cdca5}
@font-face{font-family:'Inter Tight';src:url(/assets/fonts/inter-tight-latin-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(/assets/fonts/jetbrains-mono-latin-500.woff2) format('woff2');font-weight:500;font-display:swap}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:#0e0f12;color:#f3efe4;font-family:'Inter Tight','Helvetica Neue',Arial,sans-serif;background-image:linear-gradient(rgba(243,239,228,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(243,239,228,.045) 1px,transparent 1px);background-size:88px 88px}
main{width:min(720px,100%)}
.label{margin:0 0 14px;font:500 .78rem 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
h1{margin:0;font-weight:800;text-transform:uppercase;font-size:clamp(3rem,13vw,7.5rem);line-height:.92;letter-spacing:-.01em}
h1 span{color:var(--accent)}
p{margin:24px 0 32px;max-width:520px;font-size:1.1rem;line-height:1.6;color:#9b9da4}
a{display:inline-flex;align-items:center;min-height:52px;padding:14px 24px;border-radius:12px;background:var(--accent);color:#111215;font-weight:800;text-transform:uppercase;font-size:.86rem;letter-spacing:.03em;text-decoration:none;transition:background .2s}
a:hover{background:var(--accent-hover)}a:focus-visible{outline:2px solid #f3efe4;outline-offset:4px}
</style>
</head>
<body>
<main>
<p class="label">404 / Page not found</p>
<h1>Lost in<br><span>motion.</span></h1>
<p>Even a ten-billion-percent plan hits a dead end sometimes. The link may be old or mistyped.</p>
<a href="/">Back to the portfolio</a>
</main>
</body>
</html>
